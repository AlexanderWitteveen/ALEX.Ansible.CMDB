---

- name: Copy cmdb tag template to host
  ansible.builtin.template:
    src: "tag.yml.j2"
    dest: "/{{ prop_basename }}/cmdbtag.yml"
    owner: root
    group: root
    mode: 0755
  vars:
    ansible_connection: "{{ prop_ansible_connection }}"
    ansible_host: "{{ prop_host.ipaddress }}"
  become: true
